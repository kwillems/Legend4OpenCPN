<?xml version="1.0" encoding="UTF-8"?>
<!-- The icon on the Plugins tab of OpenCPN's options: the toolbar icon
     with its symbols as buoys (red can, yellow special mark, black and
     yellow cardinal, green cone). The toolbar keeps legend_toolbar.svg. -->
<svg width="32" height="32"
     viewBox="0 0 24 24"
     xmlns="http://www.w3.org/2000/svg">

  <g stroke-width="1.2"
     stroke-linejoin="round">

    <rect x="2" y="1.5" width="4" height="4" fill="#d9302c" stroke="#8a1c1a"/>

    <circle cx="4" cy="9.5" r="2" fill="#f2c200" stroke="#8a6d00"/>

    <rect x="2" y="13.5" width="4" height="2" fill="#222222" stroke="#222222"/>
    <rect x="2" y="15.5" width="4" height="2" fill="#f2c200" stroke="#222222"/>

    <path d="M4 19.5 L1.7 23 L6.3 23 Z" fill="#2e9e44" stroke="#1a5e28"/>

  </g>

  <g stroke="#7a7a7a"
     stroke-width="1.4"
     stroke-linecap="round">

    <line x1="9" y1="3.5" x2="22" y2="3.5"/>
    <line x1="9" y1="9.5" x2="22" y2="9.5"/>
    <line x1="9" y1="15.5" x2="22" y2="15.5"/>
    <line x1="9" y1="21.5" x2="22" y2="21.5"/>

  </g>
</svg>
