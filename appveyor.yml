---
clone_folder: c:\project\opencpn\plugin_src
shallow_clone: false
clone_depth: 10

image:
  - Visual Studio 2022

platform:
  - Win32
  - x64

configuration: RelWithDebInfo
test: false

before_build:
  - git submodule update --init opencpn-libs
  - set "VS_HOME=C:\Program Files\Microsoft Visual Studio\2022"
  - if "%PLATFORM%"=="x64" (call "%VS_HOME%\Community\VC\Auxiliary\Build\vcvars64.bat") else (call "%VS_HOME%\Community\VC\Auxiliary\Build\vcvars32.bat")

build_script:
  - call ci\appveyor.bat

# Legend4OpenCPN: keep the tarballs, there is no Cloudsmith upload yet
# (re-add after update-templates).
artifacts:
  - path: build\*.tar.gz
  - path: build\*.xml
